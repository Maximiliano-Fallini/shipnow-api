paths:
  /api/orders:
    get:
      summary: Obtener todos los envios
      tags:
        - Pedidos
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Pedidos obtenidos
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
    post:
      summary: Crear un envio
      description: El total se calcula automaticamente sumando price * quantity de cada item. El estado inicial es created.
      tags:
        - Pedidos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, store, deliveryAddress, items]
              properties:
                customer:
                  type: string
                  example: 64a0e7f8c1b9f3e5d6a7b8d0
                store:
                  type: string
                  example: 64a0e7f8c1b9f3e5d6a7b8d1
                deliveryAddress:
                  type: string
                  example: Av. Siempre Viva 742
                priority:
                  type: string
                  enum: [low, normal, high]
                  example: normal
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderItem'
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/orders/{oid}:
    parameters:
      - name: oid
        in: path
        required: true
        description: Id del pedido
        schema:
          type: string
        example: 64a0e7f8c1b9f3e5d6a7b8c9
    get:
      summary: Obtener un pedido por id
      tags:
        - Pedidos
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Eliminar un pedido
      tags:
        - Pedidos
      responses:
        "200":
          description: Pedido eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/orders/{oid}/status:
    parameters:
      - name: oid
        in: path
        required: true
        description: Id del pedido
        schema:
          type: string
    get:
      summary: Consultar el estado del pedido (tracking)
      tags:
        - Pedidos
      responses:
        "200":
          description: Estado actual del envio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar el estado del pedido
      tags:
        - Pedidos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
                  example: in_transit
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/orders/{oid}/proof:
    parameters:
      - name: oid
        in: path
        required: true
        description: Id del pedido
        schema:
          type: string
    post:
      summary: Subir el comprobante de entrega del pedido
      description: Acepta archivos PDF. El archivo se envia en el campo proof y los metadatos quedan guardados en el pedido.
      tags:
        - Pedidos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                proof:
                  type: string
                  format: binary
      responses:
        "201":
          description: Comprobante subido y guardado en el pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "404":
          $ref: '#/components/responses/NotFound'
